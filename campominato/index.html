<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campo minato - Brain Playground</title>
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../shared/base.css">
<style>
.field{display:grid;width:100%;gap:2px;padding:6px;background:var(--btn-hi);border-radius:16px;box-shadow:var(--shadow);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.m{aspect-ratio:1/1;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:var(--fs,18px);cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 70%,var(--btn)),var(--btn));box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);transition:background-color .1s}
.m.open{background:var(--paper);box-shadow:none;cursor:default}
.m.open.n{cursor:pointer}
.m svg{width:70%;height:70%}
.m.boom{background:var(--err-bg)}
.m.wrongflag{background:var(--err-bg)}
.m.cur{outline:2px solid var(--ink);outline-offset:1px}
.n1{color:#3b6fd4}.n2{color:#3f8f5a}.n3{color:#d1495b}.n4{color:#6b4fb3}.n5{color:#b5651d}.n6{color:#2a9d8f}.n7{color:#333}.n8{color:#888}
@media (prefers-color-scheme: dark){.n1{color:#8fb4ff}.n2{color:#6cc488}.n3{color:#ff7b8a}.n4{color:#c4a8ff}.n5{color:#f0a36b}.n6{color:#5ed1c3}.n7{color:#ddd}.n8{color:#aaa}}
.field.won .m.mine-hidden{background:var(--ok-bg)}
</style>
</head>
<body>
<div class="app split" id="app">
  <header class="top"></header>
  <div class="stage" id="stage">
    <div class="field" id="field"></div>
  </div>
  <div class="side">
    <div class="status">
      <span class="tag" id="lvl">-</span>
      <span>Mine <b id="left">0</b></span>
      <button class="timer" id="btnPause" aria-label="Pausa"><svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"></svg><span id="timer">00:00</span></button>
    </div>
    <div class="seg" id="modeSeg">
      <button data-mode="dig" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6M4 20l9-9M12 6l6 6-3 3-6-6z"/></svg>Scava</button>
      <button data-mode="flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Bandierina</button>
    </div>
    <p class="hint-text extra">Tieni premuto una casella per mettere la bandierina. Tocca un numero per aprire le caselle intorno quando hai già messo le sue bandierine.</p>
    <p class="kbd">Mouse: clic per scavare, clic destro per la bandierina. Ogni partita si risolve con la logica, senza tirare a indovinare.</p>
  </div>
</div>
<script src="../shared/ui.js"></script>
<script src="app.js"></script>
</body>
</html>
