<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parole - Brain Playground</title>
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../shared/base.css">
<style>
:root{--hit:#5aa469;--near:#e0b43a;--miss:#8b8f9a}
@media (prefers-color-scheme: dark){:root{--hit:#4f9a60;--near:#c9a227;--miss:#3a3e4a}}
.app{min-height:100%;justify-content:space-between}
.mode{max-width:340px;width:100%;margin:0 auto}
.grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(100%, 330px, calc((100vh - 400px) * .83));margin:0 auto}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.row.shake{animation:shake .4s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tile{aspect-ratio:1/1;display:grid;place-items:center;border-radius:10px;border:2px solid var(--line);
  font-size:clamp(22px,7vw,30px);font-weight:800;text-transform:uppercase;background:var(--paper);color:var(--ink)}
.tile.filled{border-color:var(--muted);animation:tap .12s ease}
@keyframes tap{50%{transform:scale(1.08)}}
.tile.hit,.tile.near,.tile.miss{color:#fff;border-color:transparent;animation:flip .5s ease both}
.tile.hit{background:var(--hit)}.tile.near{background:var(--near)}.tile.miss{background:var(--miss)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.row.win .tile{animation:hop .5s ease both}
@keyframes hop{40%{transform:translateY(-14px)}}
.kb{display:grid;gap:7px;width:100%;max-width:520px;margin:0 auto}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:46px;height:54px;border-radius:9px;background:var(--btn);font-weight:700;font-size:16px;text-transform:uppercase;display:grid;place-items:center;transition:background-color .2s}
.key.wide{flex:1.6;max-width:72px;font-size:12px}
.key:active{background:var(--btn-hi)}
.key.hit{background:var(--hit);color:#fff}.key.near{background:var(--near);color:#fff}.key.miss{background:var(--miss);color:#fff;opacity:.75}
.key svg{width:22px;height:22px}
.dist{display:grid;gap:5px;margin:8px 0 6px}
.bar{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar span{display:block;background:var(--btn-hi);border-radius:6px;padding:3px 8px;text-align:right;font-weight:700;min-width:28px;color:var(--ink)}
.bar span.me{background:var(--hit);color:#fff}
.answer{font-size:30px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;text-align:center;margin:8px 0 2px}
@media (min-width:880px){.key:hover{background:var(--btn-hi)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top"></header>
  <div class="seg mode" id="modeSeg">
    <button data-mode="daily">Del giorno</button>
    <button data-mode="free">Libera</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="kb" id="kb"></div>
</div>
<script src="../shared/ui.js"></script>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
