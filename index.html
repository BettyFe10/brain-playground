<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Playground</title>
<meta name="description" content="Brain Playground: giochi di logica personali, senza pubblicità, anche offline.">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain Playground">
<link rel="stylesheet" href="shared/base.css">
<style>
.hub{max-width:1060px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 2px 18px;padding:18px 18px 18px 20px;border-radius:26px;background:linear-gradient(135deg,var(--t-pink),var(--t-peach) 55%,var(--t-yellow));position:relative;overflow:hidden}
.mascot{width:clamp(96px,26vw,150px);flex:none;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(224,115,140,.25))}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.hero-top{display:flex;justify-content:flex-end;margin:0 4px 8px}
.hero h1{font-family:"Nunito",ui-rounded,system-ui,sans-serif;font-weight:900;font-size:clamp(32px,8.4vw,52px);line-height:.95;letter-spacing:-1px;color:#2a2440}
.hero h1 span{color:var(--accent)}
.hero p{color:#5b5470;font-size:14px;margin-top:10px;line-height:1.45;max-width:420px;font-weight:600}
.today{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600}
.today b{color:var(--ink);font-size:14px;text-transform:capitalize;margin-right:4px}
.group{margin:26px 4px 10px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:1000px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{
  position:relative;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:22px;
  background:var(--paper);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);
  transition:transform .15s ease, box-shadow .15s ease;min-height:100%
}
.card:active{transform:scale(.98)}
@media (hover:hover){.card:hover{transform:translateY(-3px)}}
.art{width:100%;aspect-ratio:16/10;border-radius:14px;background:var(--tint,var(--bg));display:grid;place-items:center;overflow:hidden;transition:transform .2s}
@media (hover:hover){.card:hover .art svg{transform:scale(1.06) rotate(-2deg)}}
.art svg{transition:transform .25s ease}
.art svg{width:62%;height:auto;max-height:84%}
.card h3{font-family:"Nunito",ui-rounded,system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.2px}
.card p{font-size:13px;color:var(--muted);line-height:1.4;margin-top:-6px}
.filterbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;margin:18px -16px 14px;padding:10px 0 10px 16px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:box-shadow .2s}
.filterbar.stuck{box-shadow:0 8px 18px -14px rgba(31,42,68,.45)}
.sortbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;background:var(--sel);font-weight:800;font-size:14px;color:var(--ink)}
.sortbtn svg{width:18px;height:18px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 0 0;-webkit-overflow-scrolling:touch;flex:1;min-width:0;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:var(--paper);
  font-weight:800;font-size:14px;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);transition:background-color .15s,color .15s}
.filters button b{font-size:12px;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--btn);color:var(--muted);font-weight:800}
.filters button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.filters button.on b{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
.filters button:disabled{opacity:.4}
@media (min-width:700px){.filterbar{margin-left:0;margin-right:0;padding-left:2px;border-radius:999px}.filters{flex-wrap:wrap;-webkit-mask-image:none;mask-image:none}}
@media (max-width:699px){.hero{padding:14px 14px 14px 18px}.mascot{width:96px}.hero p{font-size:13px}}
.card.hide{display:none}
.cards.fade .card{animation:cardIn .25s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}}
.empty{display:none;grid-column:1 / -1;text-align:center;color:var(--muted);padding:30px 10px;font-weight:600}
.empty.show{display:block}
.chip{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--btn);color:var(--muted);margin-bottom:-4px}
.chip.c-logic{background:var(--t-blue);color:#3d5a8c}.chip.c-words{background:var(--t-mint);color:#3f7a50}.chip.c-arcade{background:var(--t-lav);color:#6b55a3}.chip.c-relax{background:var(--t-pink);color:#a8456a}
@media (prefers-color-scheme: dark){.chip.c-logic{color:#a9c1ee}.chip.c-words{color:#9fd8ae}.chip.c-arcade{color:#c7b6ef}.chip.c-relax{color:#f2a5c0}}
.card .meta{margin-top:auto;font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;min-height:18px}
.card .meta i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.card .meta.idle{color:var(--muted);font-weight:500}
.card .meta.idle i{background:var(--line)}
.foot{margin-top:34px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.offline-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--btn);font-weight:600;color:var(--ink)}
.offline-pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
:root{--t-pink:#fde0e8;--t-peach:#fde6d6;--t-yellow:#fff3c4;--t-blue:#dde8fb;--t-mint:#d9f1df;--t-lav:#e8e0f8;--t-apri:#fdebd0;--t-sky:#d5eef5}
@media (prefers-color-scheme: dark){:root{--t-pink:#3a2630;--t-peach:#3a2c24;--t-yellow:#36321f;--t-blue:#232f45;--t-mint:#1f3427;--t-lav:#2d2840;--t-apri:#3a3022;--t-sky:#1e3238}
  .hero h1{color:#fff!important}.hero p{color:#d9d2e6!important}}
/* colori delle illustrazioni */
.a-ink{fill:var(--ink)} .a-acc{fill:var(--accent)} .a-user{fill:var(--user)} .a-line{stroke:var(--line-strong)}
.a-soft{fill:var(--btn-hi)} .a-paper{fill:var(--paper)} .a-ok{fill:var(--ok)}
</style>
</head>
<body>
<main class="hub">
  <div class="hero-top"><div class="today" id="today"></div></div>
  <section class="hero">
    <div>
      <h1>Brain<br>Playground<span>.</span></h1>
      <p>Giochi per allenare la testa. Niente pubblicità, niente account, funziona anche offline.</p>
    </div>
    <img class="mascot" src="shared/mascot.svg" alt="" width="150" height="150">
  </section>

  <div id="sentinel"></div>
  <div class="filterbar" id="filterbar">
    <button class="sortbtn" id="sortBtn" aria-label="Cambia ordine"></button>
    <div class="filters" id="filters" role="tablist" aria-label="Filtra i giochi"></div>
  </div>
  <div class="cards" id="cards"></div>

  <p class="foot"><span class="offline-pill" id="netState"><i></i>Pronta offline</span><br>I progressi restano salvati su questo dispositivo.</p>
</main>

<script src="home.js"></script>
</body>
</html>
