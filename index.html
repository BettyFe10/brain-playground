<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Playground</title>
<meta name="description" content="Brain Playground: giochi di logica personali, senza pubblicità, anche offline.">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brain Playground">
<style>
:root{
  --bg:#f4efe6; --paper:#fffdf8; --ink:#1f2a44; --muted:#7a7f8c;
  --line:#d6cfc0; --line-strong:#1f2a44; --accent:#c8553d; --accent-ink:#fff;
  --user:#2f5d9e; --sel:#f6d9a8; --peer:#f1eadb; --same:#ecc89e;
  --err:#c0392b; --err-bg:#f8dcd5; --btn:#ebe4d6; --btn-hi:#e0d7c4;
  --shadow:0 1px 0 rgba(31,42,68,.06), 0 8px 24px -12px rgba(31,42,68,.25);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161c; --paper:#1c1f27; --ink:#e8e3d8; --muted:#8b8f9a;
    --line:#333745; --line-strong:#b9b2a3; --accent:#e07a5f; --accent-ink:#1a1a1a;
    --user:#8fb4ff; --sel:#5a4526; --peer:#242833; --same:#4a3a28;
    --err:#ff7b6b; --err-bg:#3d2220; --btn:#252935; --btn-hi:#2f3442;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{
  max-width:540px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column; gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:26px;font-weight:700;letter-spacing:-.5px}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:system-ui,-apple-system,sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:-2px}
.hbtns{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--btn)}
.icon-btn:active{background:var(--btn-hi)}
.icon-btn svg{width:20px;height:20px}
.pill{height:40px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px}
.pill:active{opacity:.85}

/* Status */
.status{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);padding:0 2px}
.status b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.diff-tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--btn);color:var(--ink);font-weight:600;font-size:13px}
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;padding:4px 8px;border-radius:8px}
.timer svg{width:14px;height:14px}
.timer:active{background:var(--btn)}

/* Board */
.board-wrap{position:relative}
.board{
  display:grid;grid-template-columns:repeat(9,1fr);
  aspect-ratio:1/1;width:100%;
  background:var(--paper);border:2px solid var(--line-strong);border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);
}
.cell{
  position:relative;display:grid;place-items:center;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:clamp(20px,6.4vw,30px);font-variant-numeric:tabular-nums;font-weight:500;
  cursor:pointer;transition:background-color .12s;
}
.cell.c8{border-right:0}
.cell.r8{border-bottom:0}
.cell.bR{border-right:2px solid var(--line-strong)}
.cell.bB{border-bottom:2px solid var(--line-strong)}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.given{color:var(--ink);font-weight:700}
.cell.user{color:var(--user)}
.cell.err{color:var(--err);background:var(--err-bg)}
.cell.err.sel{background:var(--sel)}
.cell.pop{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.notes i{font-style:normal;display:grid;place-items:center;font-size:clamp(9px,2.5vw,12px);color:var(--muted);font-weight:500;line-height:1}
.notes i.hit{color:var(--accent);font-weight:800}
.board.won .cell{animation:wave .6s ease both}
@keyframes wave{0%{background:var(--paper)}40%{background:var(--same)}100%{background:var(--paper)}}

.overlay-pause{
  position:absolute;inset:0;border-radius:10px;display:none;place-items:center;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-weight:600;font-size:17px;text-align:center;cursor:pointer
}
.overlay-pause small{display:block;color:var(--muted);font-weight:400;font-size:14px;margin-top:4px}
.paused .overlay-pause{display:grid}

/* Tools */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--muted);position:relative}
.tool svg{width:24px;height:24px;color:var(--ink)}
.tool:active{background:var(--btn)}
.tool .badge{position:absolute;top:4px;right:calc(50% - 26px);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--btn-hi);color:var(--muted)}
.tool.on .badge{background:var(--accent);color:var(--accent-ink)}
.tool.on{color:var(--accent)}
.tool:disabled{opacity:.35}

/* Pad */
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.num{
  aspect-ratio:3/4;border-radius:12px;background:var(--btn);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(22px,6.8vw,30px);font-weight:600;color:var(--user);font-variant-numeric:tabular-nums
}
.num small{font-size:10px;color:var(--muted);font-weight:500;margin-top:1px}
.num:active{background:var(--btn-hi);transform:translateY(1px)}
.num.done{visibility:hidden}
.notes-on .num{color:var(--accent)}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(10,12,18,.45)}
.modal.open{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:540px;background:var(--paper);border-radius:22px 22px 0 0;
  padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto;
  animation:up .22s cubic-bezier(.2,.8,.2,1)
}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-family:ui-serif,Georgia,serif;font-size:24px;margin-bottom:4px}
.sheet p.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.choices{display:grid;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px 16px;border-radius:14px;background:var(--btn)}
.choice:active{background:var(--btn-hi)}
.choice strong{display:block;font-size:16px}
.choice span{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--accent)}
.ghost{width:100%;margin-top:12px;padding:12px;border-radius:14px;color:var(--muted);font-weight:600}
.primary{width:100%;margin-top:16px;padding:14px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--btn);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
.setting small{display:block;color:var(--muted);font-size:12px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 4px}
.danger{color:var(--err);font-weight:600;padding:12px 0;font-size:14px}
.record{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Ordine su mobile: stato, griglia, strumenti, tastierino */
.side{display:contents}
.status{order:1}.board-wrap{order:2}.tools{order:3}.pad{order:4}.kbd{display:none}
header{order:0}

/* Desktop / tablet orizzontale: griglia a sinistra, comandi a destra */
@media (min-width:880px) and (min-height:560px){
  .app{
    max-width:1060px;min-height:100vh;display:grid;
    grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto 1fr;
    column-gap:48px;row-gap:28px;align-content:center;padding:32px 40px
  }
  header{grid-column:1 / -1}
  .brand{font-size:32px}
  .board-wrap{grid-column:1;grid-row:2;justify-self:center;align-self:center;width:min(100%, calc(100vh - 170px), 640px)}
  .side{display:flex;flex-direction:column;gap:22px;grid-column:2;grid-row:2;align-self:center}
  .kbd{order:5}
  .status{flex-wrap:wrap;row-gap:10px}
  .cell{font-size:clamp(22px,3.4vh,36px)}
  .notes i{font-size:clamp(10px,1.35vh,14px)}
  .tools{background:var(--btn);border-radius:16px;padding:6px}
  .tool:hover{background:var(--btn-hi)}
  .pad{grid-template-columns:repeat(3,1fr);gap:10px}
  .num{aspect-ratio:auto;height:72px;font-size:30px}
  .num:hover{background:var(--btn-hi)}
  .num.done{visibility:visible;opacity:.25;pointer-events:none}
  .cell:hover:not(.sel){filter:brightness(.97)}
  .kbd{display:block;font-size:12px;line-height:1.9;color:var(--muted)}
  .icon-btn:hover,.pill:hover{filter:brightness(1.08)}
}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--btn);border:1px solid var(--line);color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><small>Brain Playground</small>Sudoku<span>.</span></div>
    <div class="hbtns">
      <button class="icon-btn" id="btnStats" aria-label="Statistiche e impostazioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button class="pill" id="btnNew">Nuova</button>
    </div>
  </header>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board" role="grid" aria-label="Griglia sudoku"></div>
    <div class="overlay-pause" id="pauseOverlay"><div>In pausa<small>Tocca per riprendere</small></div></div>
  </div>

  <div class="side">
  <div class="status">
    <span class="diff-tag" id="diffLabel">-</span>
    <span id="errWrap">Errori <b id="errs">0</b></span>
    <span>Aiuti <b id="hints">0</b></span>
    <button class="timer" id="btnPause" aria-label="Pausa">
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <span id="timer">00:00</span>
    </button>
  </div>

  <div class="tools">
    <button class="tool" id="btnUndo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      Annulla
    </button>
    <button class="tool" id="btnErase">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      Cancella
    </button>
    <button class="tool" id="btnNotes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Note <span class="badge" id="notesBadge">OFF</span>
    </button>
    <button class="tool" id="btnHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>
      Aiuto
    </button>
  </div>

  <div class="pad" id="pad"></div>
  <p class="kbd">Tastiera: <kbd>1</kbd>-<kbd>9</kbd> numeri, frecce per muoverti, <kbd>N</kbd> note, <kbd>Canc</kbd> cancella, <kbd>Ctrl</kbd>+<kbd>Z</kbd> annulla, <kbd>H</kbd> aiuto, <kbd>Spazio</kbd> pausa</p>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ============ Geometria della griglia ============ */
const R = [], C = [], B = [], PEERS = [];
for (let i = 0; i < 81; i++) {
  R[i] = Math.floor(i / 9);
  C[i] = i % 9;
  B[i] = Math.floor(R[i] / 3) * 3 + Math.floor(C[i] / 3);
}
for (let i = 0; i < 81; i++) {
  const p = [];
  for (let j = 0; j < 81; j++) {
    if (j !== i && (R[i] === R[j] || C[i] === C[j] || B[i] === B[j])) p.push(j);
  }
  PEERS[i] = p;
}
const popcount = m => { let n = 0; while (m) { m &= m - 1; n++; } return n; };
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============ Solver a bitmask (conta soluzioni fino a "limit") ============ */
function search(grid, limit, randomize) {
  const a = grid.slice();
  const r = new Int32Array(9), c = new Int32Array(9), b = new Int32Array(9);
  for (let i = 0; i < 81; i++) {
    const v = a[i];
    if (!v) continue;
    const m = 1 << v;
    if ((r[R[i]] | c[C[i]] | b[B[i]]) & m) return { count: 0, solution: null };
    r[R[i]] |= m; c[C[i]] |= m; b[B[i]] |= m;
  }
  let count = 0, first = null;
  const rec = () => {
    let best = -1, bestMask = 0, bestCount = 10;
    for (let i = 0; i < 81; i++) {
      if (a[i]) continue;
      const m = ~(r[R[i]] | c[C[i]] | b[B[i]]) & 0x3FE;
      const n = popcount(m);
      if (n < bestCount) { best = i; bestMask = m; bestCount = n; if (n < 2) break; }
    }
    if (best < 0) { count++; if (!first) first = a.slice(); return count >= limit; }
    if (bestCount === 0) return false;
    const digits = [];
    for (let d = 1; d <= 9; d++) if (bestMask & (1 << d)) digits.push(d);
    if (randomize) shuffle(digits);
    for (const d of digits) {
      const m = 1 << d;
      a[best] = d; r[R[best]] |= m; c[C[best]] |= m; b[B[best]] |= m;
      if (rec()) return true;
      r[R[best]] &= ~m; c[C[best]] &= ~m; b[B[best]] &= ~m; a[best] = 0;
    }
    return false;
  };
  rec();
  return { count, solution: first };
}

/* ============ Generatore con soluzione unica ============ */
const LEVELS = {
  facile:    { label: 'Facile',    clues: 38, dots: 1, desc: 'Per scaldarsi' },
  medio:     { label: 'Medio',     clues: 32, dots: 2, desc: 'Il classico da giornale' },
  difficile: { label: 'Difficile', clues: 27, dots: 3, desc: 'Servono le note' },
  esperto:   { label: 'Esperto',   clues: 22, dots: 4, desc: 'Pochi numeri, tanta pazienza' }
};
function carve(level) {
  const solution = search(new Array(81).fill(0), 1, true).solution;
  const puzzle = solution.slice();
  let clues = 81;
  const target = LEVELS[level].clues;
  const tryRemove = cellsToRemove => {
    const saved = cellsToRemove.map(i => puzzle[i]);
    cellsToRemove.forEach(i => puzzle[i] = 0);
    if (search(puzzle, 2, false).count === 1) { clues -= cellsToRemove.length; return true; }
    cellsToRemove.forEach((i, k) => puzzle[i] = saved[k]);
    return false;
  };
  // 1) rimozione simmetrica (coppie i / 80-i): griglia più elegante
  for (const i of shuffle([...Array(41).keys()])) {
    if (clues <= target) break;
    if (puzzle[i]) tryRemove(i === 40 ? [40] : [i, 80 - i]);
  }
  // 2) se non basta, rimozione singola per arrivare al target
  for (const i of shuffle([...Array(81).keys()])) {
    if (clues <= target) break;
    if (puzzle[i]) tryRemove([i]);
  }
  return { puzzle, solution, clues };
}
function generate(level) {
  // per i livelli alti prova più griglie e tiene quella con meno numeri
  const tries = level === 'esperto' ? 6 : level === 'difficile' ? 3 : 1;
  let best = null;
  for (let t = 0; t < tries; t++) {
    const g = carve(level);
    if (!best || g.clues < best.clues) best = g;
    if (best.clues <= LEVELS[level].clues) break;
  }
  return { puzzle: best.puzzle, solution: best.solution };
}

/* ============ Persistenza ============ */
const K_GAME = 'sudoku.game.v1', K_SET = 'sudoku.settings.v1', K_STATS = 'sudoku.stats.v1';
const store = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage pieno o bloccato */ } }
};
const emptyStats = () => Object.fromEntries(Object.keys(LEVELS).map(k => [k, { played: 0, won: 0, best: null, total: 0, noErr: 0 }]));
let settings = Object.assign({ showErrors: true, autoNotes: true, highlight: true }, store.get(K_SET, {}));
let stats = Object.assign(emptyStats(), store.get(K_STATS, {}));
let S = store.get(K_GAME, null);          // stato partita
let sel = -1, notesMode = false, paused = false, lastPlaced = -1;

const saveGame = () => { if (S) store.set(K_GAME, S); };
const saveSettings = () => store.set(K_SET, settings);
const saveStats = () => store.set(K_STATS, stats);

/* ============ DOM ============ */
const $ = id => document.getElementById(id);
const boardEl = $('board'), padEl = $('pad'), appEl = $('app');
const cells = [];
for (let i = 0; i < 81; i++) {
  const el = document.createElement('div');
  el.className = 'cell';
  if (C[i] === 8) el.classList.add('c8');
  if (R[i] === 8) el.classList.add('r8');
  if (C[i] === 2 || C[i] === 5) el.classList.add('bR');
  if (R[i] === 2 || R[i] === 5) el.classList.add('bB');
  el.setAttribute('role', 'gridcell');
  el.addEventListener('pointerdown', e => { e.preventDefault(); select(i); });
  boardEl.appendChild(el);
  cells.push(el);
}
const padBtns = [];
for (let d = 1; d <= 9; d++) {
  const b = document.createElement('button');
  b.className = 'num';
  b.innerHTML = `${d}<small></small>`;
  b.setAttribute('aria-label', `Numero ${d}`);
  b.addEventListener('click', () => input(d));
  padEl.appendChild(b);
  padBtns.push(b);
}

/* ============ Rendering ============ */
const fmt = s => {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
};

function render() {
  if (!S) return;
  const selVal = sel >= 0 ? S.values[sel] : 0;
  const counts = new Array(10).fill(0);
  for (let i = 0; i < 81; i++) if (S.values[i]) counts[S.values[i]]++;

  for (let i = 0; i < 81; i++) {
    const el = cells[i], v = S.values[i], given = S.puzzle[i] !== 0;
    const isErr = settings.showErrors && v && !given && v !== S.solution[i];
    el.classList.toggle('given', given);
    el.classList.toggle('user', !given && !!v);
    el.classList.toggle('err', !!isErr);
    el.classList.toggle('sel', i === sel);
    el.classList.toggle('peer', settings.highlight && sel >= 0 && i !== sel && PEERS[sel].includes(i));
    el.classList.toggle('same', settings.highlight && !!selVal && i !== sel && v === selVal);
    el.classList.toggle('pop', i === lastPlaced);

    let html = '';
    if (v) html = String(v);
    else if (S.notes[i]) {
      html = '<div class="notes">';
      for (let d = 1; d <= 9; d++) {
        const on = S.notes[i] & (1 << d);
        html += `<i class="${on && d === selVal ? 'hit' : ''}">${on ? d : ''}</i>`;
      }
      html += '</div>';
    }
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
    el.setAttribute('aria-label', `Riga ${R[i] + 1}, colonna ${C[i] + 1}${v ? ', ' + v : ', vuota'}`);
  }
  lastPlaced = -1;

  padBtns.forEach((b, k) => {
    const d = k + 1, left = 9 - counts[d];
    b.classList.toggle('done', left <= 0);
    b.querySelector('small').textContent = left > 0 ? left : '';
  });

  $('diffLabel').textContent = LEVELS[S.level].label;
  $('errs').textContent = S.errors;
  $('hints').textContent = S.hints;
  $('errWrap').style.visibility = settings.showErrors ? 'visible' : 'hidden';
  $('timer').textContent = fmt(S.elapsed);
  $('btnUndo').disabled = !S.history.length || S.done;
  $('btnNotes').classList.toggle('on', notesMode);
  $('notesBadge').textContent = notesMode ? 'ON' : 'OFF';
  appEl.classList.toggle('notes-on', notesMode);
  $('boardWrap').classList.toggle('paused', paused && !S.done);
  $('pauseIcon').innerHTML = paused
    ? '<path d="M7 5v14l12-7z"/>'
    : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
}

/* ============ Azioni di gioco ============ */
function select(i) {
  if (!S || paused) return;
  sel = i;
  render();
}
function pushHistory() {
  S.history.push([S.values.slice(), S.notes.slice()]);
  if (S.history.length > 150) S.history.shift();
}
function clearPeerNotes(i, d) {
  for (const p of PEERS[i]) S.notes[p] &= ~(1 << d);
}
function input(d) {
  if (!S || S.done || paused) return;
  if (sel < 0) { toast('Seleziona prima una casella'); return; }
  const i = sel;
  if (S.puzzle[i]) return;

  if (notesMode) {
    if (S.values[i]) return;
    pushHistory();
    S.notes[i] ^= (1 << d);
  } else {
    pushHistory();
    if (S.values[i] === d) {              // stesso numero: lo toglie
      S.values[i] = 0;
    } else {
      S.values[i] = d;
      S.notes[i] = 0;
      lastPlaced = i;
      if (d !== S.solution[i]) {
        S.errors++;
        if (navigator.vibrate) navigator.vibrate(60);
      }
      if (settings.autoNotes) clearPeerNotes(i, d);
    }
  }
  afterMove();
}
function erase() {
  if (!S || S.done || paused || sel < 0 || S.puzzle[sel]) return;
  if (!S.values[sel] && !S.notes[sel]) return;
  pushHistory();
  S.values[sel] = 0;
  S.notes[sel] = 0;
  afterMove();
}
function undo() {
  if (!S || S.done || paused || !S.history.length) return;
  const [v, n] = S.history.pop();
  S.values = v; S.notes = n;
  afterMove();
}
function hint() {
  if (!S || S.done || paused) return;
  const needs = i => !S.puzzle[i] && S.values[i] !== S.solution[i];
  let target = sel >= 0 && needs(sel) ? sel : -1;
  if (target < 0) {
    // sceglie la casella vuota più vincolata: l'aiuto è più utile lì
    let bestN = 99;
    for (let i = 0; i < 81; i++) {
      if (!needs(i)) continue;
      const used = new Set(PEERS[i].map(p => S.values[p]).filter(Boolean));
      const n = 9 - used.size;
      if (n < bestN) { bestN = n; target = i; }
    }
  }
  if (target < 0) return;
  pushHistory();
  S.values[target] = S.solution[target];
  S.notes[target] = 0;
  clearPeerNotes(target, S.solution[target]);
  S.hints++;
  sel = target;
  lastPlaced = target;
  afterMove();
}
function afterMove() {
  if (S.values.every((v, i) => v === S.solution[i])) win();
  render();
  saveGame();
}
function toggleNotes() { notesMode = !notesMode; render(); }
function togglePause(force) {
  if (!S || S.done) return;
  paused = typeof force === 'boolean' ? force : !paused;
  render();
}

/* ============ Timer ============ */
setInterval(() => {
  if (!S || S.done || paused || document.hidden || $('modal').classList.contains('open')) return;
  S.elapsed++;
  $('timer').textContent = fmt(S.elapsed);
  if (S.elapsed % 5 === 0) saveGame();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

/* ============ Nuova partita / vittoria ============ */
function startGame(level) {
  showSheet(`<div class="loading"><div class="spinner"></div>Preparo una griglia ${LEVELS[level].label.toLowerCase()}...</div>`, true);
  setTimeout(() => {
    const { puzzle, solution } = generate(level);
    S = {
      level, puzzle, solution,
      values: puzzle.slice(), notes: new Array(81).fill(0),
      errors: 0, hints: 0, elapsed: 0, done: false, history: [], created: Date.now()
    };
    stats[level].played++;
    saveStats();
    sel = -1; notesMode = false; paused = false;
    boardEl.classList.remove('won');
    saveGame();
    closeSheet();
    render();
  }, 40);
}
function win() {
  if (S.done) return;
  S.done = true;
  sel = -1;
  const st = stats[S.level];
  st.won++;
  st.total += S.elapsed;
  if (!S.errors && !S.hints) st.noErr++;
  const record = !S.hints && (st.best === null || S.elapsed < st.best);
  if (record) st.best = S.elapsed;
  saveStats();
  saveGame();
  boardEl.classList.add('won');
  cells.forEach((el, i) => el.style.animationDelay = ((R[i] + C[i]) * 35) + 'ms');
  setTimeout(() => {
    cells.forEach(el => el.style.animationDelay = '');
    showSheet(`
      <h2>Risolto!</h2>
      <p class="sub">${LEVELS[S.level].label}${record ? '' : (S.hints ? ' - con aiuti il tempo non vale come record' : '')}</p>
      ${record ? '<span class="record">Nuovo record</span>' : ''}
      <div class="stats-grid">
        <div class="stat"><b>${fmt(S.elapsed)}</b><span>Tempo</span></div>
        <div class="stat"><b>${S.errors}</b><span>Errori</span></div>
        <div class="stat"><b>${S.hints}</b><span>Aiuti</span></div>
      </div>
      <button class="primary" data-act="new">Nuova partita</button>
      <button class="ghost" data-act="close">Guarda la griglia</button>
    `);
  }, 900);
}

/* ============ Fogli modali ============ */
function showSheet(html, locked = false) {
  $('sheet').innerHTML = html;
  $('modal').classList.add('open');
  $('modal').dataset.locked = locked ? '1' : '';
}
function closeSheet() { $('modal').classList.remove('open'); }
$('modal').addEventListener('click', e => {
  if (e.target === $('modal') && !$('modal').dataset.locked) closeSheet();
});
$('sheet').addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'close') closeSheet();
  else if (act === 'new') showNewGame();
  else if (act === 'level') startGame(t.dataset.level);
  else if (act === 'toggle') {
    settings[t.dataset.key] = !settings[t.dataset.key];
    saveSettings();
    t.querySelector('.switch').classList.toggle('on', settings[t.dataset.key]);
    render();
  } else if (act === 'reset') {
    if (confirm('Azzerare tutte le statistiche?')) { stats = emptyStats(); saveStats(); showStats(); }
  } else if (act === 'restart') {
    if (confirm('Ricominciare questa griglia da capo?')) {
      S.values = S.puzzle.slice(); S.notes = new Array(81).fill(0);
      S.errors = 0; S.hints = 0; S.elapsed = 0; S.history = []; S.done = false;
      boardEl.classList.remove('won');
      sel = -1; saveGame(); closeSheet(); render();
    }
  }
});

function showNewGame(firstRun = false) {
  const opts = Object.entries(LEVELS).map(([k, L]) => `
    <button class="choice" data-act="level" data-level="${k}">
      <div><strong>${L.label}</strong><span>${L.desc}</span></div>
      <div class="dots">${[1,2,3,4].map(n => `<i class="${n <= L.dots ? 'f' : ''}"></i>`).join('')}</div>
    </button>`).join('');
  const canContinue = !firstRun && S && !S.done;
  showSheet(`
    <h2>Nuova partita</h2>
    <p class="sub">${canContinue ? 'La partita in corso verrà sostituita.' : 'Scegli la difficoltà.'}</p>
    <div class="choices">${opts}</div>
    ${canContinue ? '<button class="ghost" data-act="restart">Ricomincia questa griglia</button><button class="ghost" data-act="close" style="margin-top:0">Continua la partita</button>' : ''}
  `, firstRun);
}

function showStats() {
  const tw = Object.values(stats).reduce((a, s) => a + s.won, 0);
  const tp = Object.values(stats).reduce((a, s) => a + s.played, 0);
  const rows = Object.entries(LEVELS).map(([k, L]) => {
    const s = stats[k];
    return `<tr><td>${L.label}</td><td>${s.won}/${s.played}</td><td>${s.best !== null ? fmt(s.best) : '-'}</td><td>${s.won ? fmt(Math.round(s.total / s.won)) : '-'}</td></tr>`;
  }).join('');
  const sw = (key, title, sub) => `
    <button class="setting" data-act="toggle" data-key="${key}" style="width:100%;text-align:left">
      <div>${title}<small>${sub}</small></div><span class="switch ${settings[key] ? 'on' : ''}"></span>
    </button>`;
  showSheet(`
    <h2>Statistiche</h2>
    <div class="stats-grid">
      <div class="stat"><b>${tw}</b><span>Vinte</span></div>
      <div class="stat"><b>${tp ? Math.round(tw / tp * 100) : 0}%</b><span>Completate</span></div>
      <div class="stat"><b>${Object.values(stats).reduce((a, s) => a + s.noErr, 0)}</b><span>Perfette</span></div>
    </div>
    <table><thead><tr><th>Livello</th><th>Vinte</th><th>Record</th><th>Media</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="section-title">Impostazioni</div>
    ${sw('showErrors', 'Mostra errori', 'Colora in rosso i numeri sbagliati')}
    ${sw('autoNotes', 'Note automatiche', 'Inserendo un numero lo toglie dalle note vicine')}
    ${sw('highlight', 'Evidenziazioni', 'Riga, colonna, quadrato e numeri uguali')}
    <button class="danger" data-act="reset">Azzera statistiche</button>
    <button class="primary" data-act="close">Chiudi</button>
  `);
}

/* ============ Toast ============ */
let toastT;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ============ Eventi ============ */
$('btnNew').addEventListener('click', () => showNewGame());
$('btnStats').addEventListener('click', showStats);
$('btnUndo').addEventListener('click', undo);
$('btnErase').addEventListener('click', erase);
$('btnNotes').addEventListener('click', toggleNotes);
$('btnHint').addEventListener('click', hint);
$('btnPause').addEventListener('click', () => togglePause());
$('pauseOverlay').addEventListener('click', () => togglePause(false));

document.addEventListener('keydown', e => {
  if ($('modal').classList.contains('open')) { if (e.key === 'Escape' && !$('modal').dataset.locked) closeSheet(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (/^[1-9]$/.test(e.key)) { input(+e.key); return; }
  if (['Backspace', 'Delete', '0'].includes(e.key)) { erase(); return; }
  if (e.key.toLowerCase() === 'n') { toggleNotes(); return; }
  if (e.key.toLowerCase() === 'h') { hint(); return; }
  if (e.key === ' ') { e.preventDefault(); togglePause(); return; }
  const moves = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 };
  if (moves[e.key] !== undefined) {
    e.preventDefault();
    if (sel < 0) { select(40); return; }
    let r = R[sel], c = C[sel];
    if (e.key === 'ArrowUp') r = (r + 8) % 9;
    if (e.key === 'ArrowDown') r = (r + 1) % 9;
    if (e.key === 'ArrowLeft') c = (c + 8) % 9;
    if (e.key === 'ArrowRight') c = (c + 1) % 9;
    select(r * 9 + c);
  }
});

/* ============ Avvio ============ */
if (S && Array.isArray(S.values) && S.values.length === 81 && LEVELS[S.level]) {
  if (!Array.isArray(S.history)) S.history = [];
  if (S.done) boardEl.classList.remove('won');
  render();
} else {
  S = null;
  showNewGame(true);
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
window.__sudoku = { get state() { return S; }, generate, search };
})();
</script>
</body>
</html>
