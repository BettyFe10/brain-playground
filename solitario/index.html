<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solitario - Brain Playground</title>
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../shared/base.css">
<style>
.table{--cw:48px;--ch:calc(var(--cw) * 1.4);position:relative;width:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.row{display:grid;grid-template-columns:repeat(7,var(--cw));justify-content:space-between;margin-bottom:12px}
.slot{width:var(--cw);height:var(--ch);border-radius:calc(var(--cw) * .14);border:2px dashed var(--line);position:relative;display:grid;place-items:center;color:var(--line)}
.slot svg{width:45%;height:45%}
.pile{position:relative;width:var(--cw);min-height:var(--ch)}
.c{position:absolute;left:0;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw) * .14);background:#fffdf8;box-shadow:0 1px 2px rgba(0,0,0,.18);
  cursor:pointer;transition:top .15s ease, left .15s ease, transform .12s;color:#2a2440;overflow:hidden}
.c .tl{position:absolute;top:3%;left:7%;font-weight:900;font-size:calc(var(--cw) * .34);line-height:1;display:flex;flex-direction:column;align-items:center;letter-spacing:-.04em}
.c .tl svg{width:calc(var(--cw) * .24);height:calc(var(--cw) * .24);margin-top:1px}
.c .big{position:absolute;right:7%;bottom:6%;width:46%;height:46%}
.c.red{color:#d64545}
.c.down{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 40%),repeating-linear-gradient(45deg,#f9b4c4 0 6px,#f7a3b7 6px 12px);border:2px solid #fffdf8}
.c.down *{display:none}
.c.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--accent),0 8px 16px -6px rgba(0,0,0,.35)}
.c.shake{animation:shk .3s ease}
@keyframes shk{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@media (prefers-color-scheme: dark){.c{background:#f4efe6}.c.down{background:repeating-linear-gradient(45deg,#6b3b4a 0 6px,#5e3341 6px 12px);border-color:#3a3e4a}}
.tools{grid-template-columns:repeat(3,1fr)}
.table.won .c{animation:hop .6s ease both}
@keyframes hop{40%{transform:translateY(-14px) rotate(-4deg)}}
#btnAuto{display:none}
#btnAuto.show{display:flex}
</style>
</head>
<body>
<div class="app split" id="app">
  <header class="top"></header>
  <div class="stage" id="stage">
    <div class="table" id="table"></div>
  </div>
  <div class="side">
    <div class="status">
      <span class="tag" id="lvl">-</span>
      <span>Mosse <b id="moves">0</b></span>
      <button class="timer" id="btnPause" aria-label="Pausa"><svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"></svg><span id="timer">00:00</span></button>
    </div>
    <div class="tools">
      <button class="tool" id="btnUndo"></button>
      <button class="tool" id="btnHint"></button>
      <button class="tool" id="btnAuto"></button>
    </div>
    <p class="hint-text extra">Tocca una carta: va da sola nel posto migliore. Tocca il mazzo per girare nuove carte.</p>
    <p class="kbd">Clic su una carta per spostarla automaticamente. <kbd>Ctrl</kbd>+<kbd>Z</kbd> annulla, <kbd>Spazio</kbd> gira dal mazzo</p>
  </div>
</div>
<script src="../shared/ui.js"></script>
<script src="app.js"></script>
</body>
</html>
