<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku - Brain Playground</title>
<meta name="description" content="Brain Playground: giochi di logica personali, senza pubblicità, anche offline.">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brain Playground">
<style>
@font-face{font-family:"Nunito";src:url("../shared/fonts/nunito.woff2") format("woff2");font-weight:200 1000;font-style:normal;font-display:swap}
:root{
  --bg:#f4efe6; --paper:#fffdf8; --ink:#1f2a44; --muted:#7a7f8c;
  --line:#d6cfc0; --line-strong:#1f2a44; --accent:#c8553d; --accent-ink:#fff;
  --user:#2f5d9e; --sel:#f6d9a8; --peer:#f1eadb; --same:#ecc89e;
  --err:#c0392b; --err-bg:#f8dcd5; --btn:#ebe4d6; --btn-hi:#e0d7c4;
  --shadow:0 1px 0 rgba(31,42,68,.06), 0 8px 24px -12px rgba(31,42,68,.25);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161c; --paper:#1c1f27; --ink:#e8e3d8; --muted:#8b8f9a;
    --line:#333745; --line-strong:#b9b2a3; --accent:#e07a5f; --accent-ink:#1a1a1a;
    --user:#8fb4ff; --sel:#5a4526; --peer:#242833; --same:#4a3a28;
    --err:#ff7b6b; --err-bg:#3d2220; --btn:#252935; --btn-hi:#2f3442;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-touch-callout:none}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{
  max-width:540px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column; gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:"Nunito",ui-rounded,system-ui,sans-serif;font-size:26px;font-weight:900;letter-spacing:-.5px}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:"Nunito",ui-rounded,system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:-2px}
.hbtns{display:flex;gap:6px}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
@media (max-width:480px){.top-left .brand small{display:none}.top-left .brand{font-size:24px}}
a{color:inherit;text-decoration:none}
.brand{line-height:1.05}
.icon-btn{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:var(--btn)}
.icon-btn:active{background:var(--btn-hi)}
.icon-btn svg{width:20px;height:20px}
.pill{height:42px;padding:0 18px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;box-shadow:0 6px 14px -8px var(--accent)}
.pill:active{opacity:.85}

/* Status */
.status{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);padding:0 2px}
.status b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.diff-tag{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--sel);color:var(--ink);font-weight:800;font-size:13px}
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;padding:4px 8px;border-radius:8px}
.timer svg{width:14px;height:14px}
.timer:active{background:var(--btn)}

/* Board */
.board-wrap{position:relative}
.board{
  display:grid;grid-template-columns:repeat(9,1fr);
  aspect-ratio:1/1;width:100%;
  background:var(--paper);border:2px solid var(--line-strong);border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);
}
.cell{
  position:relative;display:grid;place-items:center;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:clamp(20px,6.4vw,30px);font-variant-numeric:tabular-nums;font-weight:500;
  cursor:pointer;transition:background-color .12s;
}
.cell.c8{border-right:0}
.cell.r8{border-bottom:0}
.cell.bR{border-right:2px solid var(--line-strong)}
.cell.bB{border-bottom:2px solid var(--line-strong)}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.given{color:var(--ink);font-weight:700}
.cell.user{color:var(--user)}
.cell.err{color:var(--err);background:var(--err-bg)}
.cell.err.sel{background:var(--sel)}
.cell.pop{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.notes i{font-style:normal;display:grid;place-items:center;font-size:clamp(9px,2.5vw,12px);color:var(--muted);font-weight:500;line-height:1}
.notes i.hit{color:var(--accent);font-weight:800}
.board.won .cell{animation:wave .6s ease both}
@keyframes wave{0%{background:var(--paper)}40%{background:var(--same)}100%{background:var(--paper)}}

.overlay-pause{
  position:absolute;inset:0;border-radius:10px;display:none;place-items:center;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-weight:600;font-size:17px;text-align:center;cursor:pointer
}
.overlay-pause small{display:block;color:var(--muted);font-weight:400;font-size:14px;margin-top:4px}
.paused .overlay-pause{display:grid}

/* Tools */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--muted);position:relative}
.tool svg{width:24px;height:24px;color:var(--ink)}
.tool:active{background:var(--btn)}
.tool .badge{position:absolute;top:4px;right:calc(50% - 26px);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--btn-hi);color:var(--muted)}
.tool.on .badge{background:var(--accent);color:var(--accent-ink)}
.tool.on{color:var(--accent)}
.tool:disabled{opacity:.35}

/* Pad */
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.num{
  aspect-ratio:3/4;border-radius:14px;background:var(--btn);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(22px,6.8vw,30px);font-weight:600;color:var(--user);font-variant-numeric:tabular-nums
}
.num small{font-size:10px;color:var(--muted);font-weight:500;margin-top:1px}
.num:active{background:var(--btn-hi);transform:translateY(1px)}
.num.done{visibility:hidden}
.notes-on .num{color:var(--accent)}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(10,12,18,.45)}
.modal.open{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:540px;background:var(--paper);border-radius:22px 22px 0 0;
  padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto;
  animation:up .22s cubic-bezier(.2,.8,.2,1)
}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-family:"Nunito",ui-rounded,system-ui,sans-serif;font-weight:900;font-size:25px;margin-bottom:4px}
.sheet p.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.choices{display:grid;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px 16px;border-radius:14px;background:var(--btn)}
.choice:active{background:var(--btn-hi)}
.choice strong{display:block;font-size:16px}
.choice span{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--accent)}
.ghost{width:100%;margin-top:12px;padding:12px;border-radius:14px;color:var(--muted);font-weight:600}
.primary{width:100%;margin-top:16px;padding:15px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;box-shadow:0 8px 18px -10px var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--btn);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
.setting small{display:block;color:var(--muted);font-size:12px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 4px}
.danger{color:var(--err);font-weight:600;padding:12px 0;font-size:14px}
.record{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Ordine su mobile: stato, griglia, strumenti, tastierino */
.side{display:contents}
.status{order:1}.board-wrap{order:2}.tools{order:3}.pad{order:4}.kbd{display:none}
header{order:0}

/* Desktop / tablet orizzontale: griglia a sinistra, comandi a destra */
@media (min-width:880px) and (min-height:560px){
  .app{
    max-width:1060px;min-height:100vh;min-height:100dvh;display:grid;
    grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto 1fr;
    column-gap:48px;row-gap:28px;align-content:center;padding:32px 40px
  }
  header{grid-column:1 / -1}
  .brand{font-size:32px}
  .board-wrap{grid-column:1;grid-row:2;justify-self:center;align-self:center;width:min(100%, calc(100dvh - 170px), 640px)}
  .side{display:flex;flex-direction:column;gap:22px;grid-column:2;grid-row:2;align-self:center}
  .kbd{order:5}
  .status{flex-wrap:wrap;row-gap:10px}
  .cell{font-size:clamp(22px,3.4vh,36px)}
  .notes i{font-size:clamp(10px,1.35vh,14px)}
  .tools{background:var(--btn);border-radius:16px;padding:6px}
  .tool:hover{background:var(--btn-hi)}
  .pad{grid-template-columns:repeat(3,1fr);gap:10px}
  .num{aspect-ratio:auto;height:72px;font-size:30px}
  .num:hover{background:var(--btn-hi)}
  .num.done{visibility:visible;opacity:.25;pointer-events:none}
  .cell:hover:not(.sel){filter:brightness(.97)}
  .kbd{display:block;font-size:12px;line-height:1.9;color:var(--muted)}
  .icon-btn:hover,.pill:hover{filter:brightness(1.08)}
}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--btn);border:1px solid var(--line);color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="top-left">
      <a class="icon-btn" href="../" aria-label="Torna ai giochi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg></a>
      <div class="brand"><small>Brain Playground</small>Sudoku<span>.</span></div>
    </div>
    <div class="hbtns">
      <button class="icon-btn" id="btnStats" aria-label="Statistiche e impostazioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button class="pill" id="btnNew">Nuova</button>
    </div>
  </header>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board" role="grid" aria-label="Griglia sudoku"></div>
    <div class="overlay-pause" id="pauseOverlay"><div>In pausa<small>Tocca per riprendere</small></div></div>
  </div>

  <div class="side">
  <div class="status">
    <span class="diff-tag" id="diffLabel">-</span>
    <span id="errWrap">Errori <b id="errs">0</b></span>
    <span>Aiuti <b id="hints">0</b></span>
    <button class="timer" id="btnPause" aria-label="Pausa">
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <span id="timer">00:00</span>
    </button>
  </div>

  <div class="tools">
    <button class="tool" id="btnUndo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      Annulla
    </button>
    <button class="tool" id="btnErase">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      Cancella
    </button>
    <button class="tool" id="btnNotes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Note <span class="badge" id="notesBadge">OFF</span>
    </button>
    <button class="tool" id="btnHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>
      Aiuto
    </button>
  </div>

  <div class="pad" id="pad"></div>
  <p class="kbd">Tastiera: <kbd>1</kbd>-<kbd>9</kbd> numeri, frecce per muoverti, <kbd>N</kbd> note, <kbd>Canc</kbd> cancella, <kbd>Ctrl</kbd>+<kbd>Z</kbd> annulla, <kbd>H</kbd> aiuto, <kbd>Spazio</kbd> pausa</p>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
