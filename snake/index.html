<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake - Brain Playground</title>
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/arcade.css">
</head>
<body>
<div class="app split" id="app">
  <header class="top"></header>
  <div class="stage" id="stage">
    <div class="arena" id="arena">
      <canvas id="cv"></canvas>
      <div class="cover show" id="cover"></div>
    </div>
  </div>
  <div class="side">
    <div class="status">
      <span class="tag" id="modeTag">-</span>
      <span>Punti <b class="score" id="score">0</b></span>
      <span>Record <b class="score" id="best">0</b></span>
      <button class="timer" id="btnPause" aria-label="Pausa"><svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"></svg></button>
    </div>
    <div class="joy extra" id="joy" aria-label="Pad direzionale">
      <span class="arr" style="top:calc(50% - 74px)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></span>
      <span class="arr" style="left:calc(50% - 82px)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
      <span class="arr" style="right:calc(50% - 82px)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      <div class="ring"><span class="knob"></span></div>
      <span class="arr" style="bottom:calc(50% - 74px)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
    </div>
    <p class="hint-text extra">Puoi anche scorrere in qualsiasi punto dello schermo.</p>
    <p class="kbd">Tastiera: frecce o <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>, <kbd>Spazio</kbd> pausa, <kbd>Invio</kbd> ricomincia</p>
  </div>
</div>
<script src="../shared/ui.js"></script>
<script src="app.js"></script>
</body>
</html>
