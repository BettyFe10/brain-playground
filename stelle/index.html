<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stelle - Brain Playground</title>
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../shared/base.css">
<style>
:root{
  --r0:#f7d6c4;--r1:#d8e8c6;--r2:#cfe0f2;--r3:#f3e1a6;--r4:#e6d3ef;--r5:#c9ebe4;--r6:#f6cfd8;--r7:#e4dccb;--r8:#d6dcf5;
  --star:#e0a100;
}
@media (prefers-color-scheme: dark){
  :root{--r0:#4a3428;--r1:#33412b;--r2:#2b3a4c;--r3:#4a4127;--r4:#3d2f47;--r5:#25423d;--r6:#4a2c35;--r7:#3b372e;--r8:#2f3552;--star:#ffd257}
}
.board{display:grid;aspect-ratio:1/1;width:100%;border:2.5px solid var(--line-strong);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:var(--paper)}
.cell{position:relative;display:grid;place-items:center;cursor:pointer;border-right:1px solid color-mix(in srgb,var(--line-strong) 18%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line-strong) 18%,transparent)}
.cell.cR{border-right:2.5px solid var(--line-strong)}
.cell.cB{border-bottom:2.5px solid var(--line-strong)}
.cell.lastC{border-right:0}.cell.lastR{border-bottom:0}
.cell svg{width:62%;height:62%;color:var(--star);filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.cell.star svg{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.3) rotate(-40deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cell .dot{width:18%;height:18%;border-radius:50%;background:var(--ink);opacity:.45}
.cell.bad svg{color:var(--err)}
.cell.cur{box-shadow:inset 0 0 0 3px var(--ink)}
.cell.hintc{animation:flash .9s ease}
@keyframes flash{30%{box-shadow:inset 0 0 0 4px var(--accent)}}
.board.won .cell svg{animation:spin .8s ease both}
@keyframes spin{to{transform:rotate(360deg) scale(1.1)}}
.tools{grid-template-columns:repeat(3,1fr)}
</style>
</head>
<body>
<div class="app split" id="app">
  <header class="top"></header>
  <div class="stage" id="stage">
    <div class="board" id="board"></div>
    <div class="overlay-pause" id="pauseOverlay"><div>In pausa<small>Tocca per riprendere</small></div></div>
  </div>
  <div class="side">
    <div class="status">
      <span class="tag" id="lvl">-</span>
      <span>Stelle <b id="starCount">0</b></span>
      <span>Aiuti <b id="hints">0</b></span>
      <button class="timer" id="btnPause" aria-label="Pausa"><svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"></svg><span id="timer">00:00</span></button>
    </div>
    <div class="tools">
      <button class="tool" id="btnUndo"></button>
      <button class="tool" id="btnHint"></button>
      <button class="tool" id="btnRestart"></button>
    </div>
    <p class="hint-text extra">Tocca una volta per un puntino (qui niente stella), due volte per la stella.</p>
    <p class="kbd">Tastiera: frecce, <kbd>Spazio</kbd> cambia, <kbd>S</kbd> stella, <kbd>.</kbd> puntino, <kbd>Canc</kbd> svuota, <kbd>Ctrl</kbd>+<kbd>Z</kbd> annulla</p>
  </div>
</div>
<script src="../shared/ui.js"></script>
<script src="app.js"></script>
</body>
</html>
